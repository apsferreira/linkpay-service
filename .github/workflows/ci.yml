name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Postgres via Docker
        run: |
          docker run -d --name pg_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=linkpay_test \
            -p 5432:5432 \
            postgres:15
          for i in $(seq 1 30); do
            docker exec pg_test pg_isready -U postgres 2>/dev/null && echo "postgres pronto" && break
            sleep 2
          done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download dependencies
        env:
          GOTOOLCHAIN: auto
        run: go mod download
        working-directory: ./backend

      - name: Run tests
        continue-on-error: false
        env:
          GOTOOLCHAIN: auto
          DATABASE_URL: postgres://postgres:***@localhost:5432/linkpay_test?sslmode=disable
        run: go test ./... -timeout 300s -cover -coverprofile=coverage.out -coverpkg=./internal/...,./pkg/...
        working-directory: ./backend

      - name: Check coverage >= 80%
        continue-on-error: false
        env:
          GOTOOLCHAIN: auto
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 80" | bc)" = "1" ]; then
            echo "❌ Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"
        working-directory: ./backend

      - name: Check PII (buyer_email) em qualquer logger
        run: |
          echo "=== Verificando buyer_email em código Go (qualquer logger) ==="
          if grep -rn 'buyer_email' --include='*.go' . | grep -v '_test.go'; then
            echo "FALHA: buyer_email detectado em código Go (não-teste)!"
            exit 1
          fi
          echo "OK: nenhum buyer_email encontrado"
        working-directory: ./backend

      - name: Cleanup containers
        if: always()
        run: docker rm -f pg_test || true

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/apsferreira/linkpay-service
          tags: |
            type=raw,value=main-latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update image tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          find deploy/ -name "deployment.yaml" -exec \
            sed -i \
              -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
              -e "s|image: ghcr.io/apsferreira/linkpay-service:.*|image: ghcr.io/apsferreira/linkpay-service:${IMAGE_TAG}|" \
              {} \;

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/
          git diff --staged --quiet || git commit -m "ci: update images to sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          git push
