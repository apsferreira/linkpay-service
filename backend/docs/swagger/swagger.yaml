basePath: /
definitions:
  domain.AnticipationPreview:
    properties:
      available_at:
        type: string
      eligible_cents:
        type: integer
      eligible_purchases:
        type: integer
      fee_cents:
        type: integer
      net_cents:
        type: integer
    type: object
  domain.AnticipationRequestBody:
    properties:
      pix_key:
        maxLength: 255
        type: string
    type: object
  domain.Balance:
    properties:
      available_cents:
        type: integer
      held_cents:
        type: integer
      next_payout_date:
        type: string
      reserve_cents:
        type: integer
      total_cents:
        type: integer
    type: object
  domain.CreateCartRequest:
    properties:
      add_upsells:
        type: boolean
    type: object
  domain.CreateDigitalProductRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      download_limit:
        maximum: 100
        minimum: 1
        type: integer
      file_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 255
        type: string
      price_cents:
        minimum: 1
        type: integer
      product_type:
        enum:
        - digital
        - ebook
        - course
        - template
        type: string
      slug:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    - price_cents
    - product_type
    - slug
    type: object
  domain.CreateSubscriptionPlanRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      features:
        items:
          type: string
        maxItems: 20
        type: array
      interval:
        enum:
        - monthly
        - yearly
        type: string
      name:
        maxLength: 100
        type: string
      price_cents:
        minimum: 1
        type: integer
      slug:
        maxLength: 50
        minLength: 2
        type: string
      sort_order:
        minimum: 0
        type: integer
      trial_days:
        maximum: 90
        minimum: 0
        type: integer
    required:
    - interval
    - name
    - price_cents
    - slug
    type: object
  domain.CreatorPayout:
    properties:
      amount_cents:
        type: integer
      anticipation_fee_cents:
        type: integer
      asaas_transfer_id:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      error_message:
        type: string
      id:
        type: string
      is_anticipation:
        type: boolean
      payout_method:
        type: string
      pix_key:
        type: string
      platform_fee_cents:
        type: integer
      purchase_ids:
        items:
          type: integer
        type: array
      scheduled_for:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.DailyStat:
    properties:
      date:
        type: string
      revenue_cents:
        type: integer
      sales:
        type: integer
    type: object
  domain.DigitalProduct:
    properties:
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      download_limit:
        type: integer
      file_name:
        type: string
      file_size_bytes:
        type: integer
      file_url:
        type: string
      files:
        items:
          $ref: '#/definitions/domain.DigitalProductFile'
        type: array
      id:
        type: string
      is_active:
        type: boolean
      mime_type:
        type: string
      name:
        type: string
      platform_commission_pct:
        type: integer
      price_cents:
        type: integer
      product_type:
        type: string
      slug:
        type: string
      storage_bucket:
        type: string
      storage_key:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.DigitalProductFile:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      file_size_bytes:
        type: integer
      id:
        type: string
      mime_type:
        type: string
      product_id:
        type: string
      sort_order:
        type: integer
      storage_key:
        type: string
    type: object
  domain.DigitalPurchase:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      amount_cents:
        type: integer
      anticipation_requested_at:
        type: string
      created_at:
        type: string
      creator_earnings_cents:
        type: integer
      customer_cpf:
        type: string
      customer_email:
        type: string
      customer_name:
        type: string
      download_count:
        type: integer
      external_charge_id:
        type: string
      id:
        type: string
      payment_method:
        type: string
      payment_status:
        type: string
      payment_url:
        type: string
      payout_id:
        type: string
      pix_copy_paste:
        type: string
      pix_qr_code:
        description: Campos transitórios (não persistidos)
        type: string
      platform_fee_cents:
        type: integer
      product_id:
        type: string
      tenant_id:
        type: string
    type: object
  domain.DigitalSubscription:
    properties:
      access_token:
        type: string
      asaas_customer_id:
        type: string
      asaas_subscription_id:
        type: string
      cancelled_at:
        type: string
      created_at:
        type: string
      current_period_end:
        type: string
      current_period_start:
        type: string
      customer_cpf:
        type: string
      customer_email:
        type: string
      customer_name:
        type: string
      id:
        type: string
      plan:
        $ref: '#/definitions/domain.DigitalSubscriptionPlan'
      plan_id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.DigitalSubscriptionPlan:
    properties:
      created_at:
        type: string
      description:
        type: string
      features:
        items:
          type: string
        type: array
      id:
        type: string
      interval:
        description: monthly | yearly
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
      product_id:
        type: string
      slug:
        type: string
      sort_order:
        type: integer
      tenant_id:
        type: string
      trial_days:
        type: integer
      updated_at:
        type: string
    type: object
  domain.InitiatePurchaseRequest:
    properties:
      customer_cpf:
        maxLength: 14
        type: string
      customer_email:
        maxLength: 255
        type: string
      customer_name:
        maxLength: 255
        type: string
      payment_method:
        enum:
        - pix
        - credit_card
        type: string
    required:
    - customer_email
    - customer_name
    - payment_method
    type: object
  domain.ListPayoutsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.CreatorPayout'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  domain.PayoutRequestBody:
    properties:
      amount_cents:
        minimum: 1000
        type: integer
      pix_key:
        maxLength: 255
        type: string
    required:
    - pix_key
    type: object
  domain.ProductStats:
    properties:
      id:
        type: string
      name:
        type: string
      revenue_cents:
        type: integer
      sales:
        type: integer
    type: object
  domain.StatsResponse:
    properties:
      daily_sales:
        items:
          $ref: '#/definitions/domain.DailyStat'
        type: array
      period:
        type: string
      products:
        items:
          $ref: '#/definitions/domain.ProductStats'
        type: array
      total_revenue_cents:
        type: integer
      total_sales:
        type: integer
    type: object
  domain.SubscribeRequest:
    properties:
      customer_cpf:
        maxLength: 14
        type: string
      customer_email:
        maxLength: 255
        type: string
      customer_name:
        maxLength: 255
        type: string
    required:
    - customer_email
    - customer_name
    type: object
  domain.UpdateDigitalProductRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      download_limit:
        maximum: 100
        minimum: 1
        type: integer
      file_url:
        maxLength: 2048
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      price_cents:
        minimum: 1
        type: integer
      product_type:
        enum:
        - digital
        - ebook
        - course
        - template
        type: string
    type: object
  domain.UpdateSubscriptionPlanRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      features:
        items:
          type: string
        maxItems: 20
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 100
        type: string
      price_cents:
        minimum: 1
        type: integer
      sort_order:
        minimum: 0
        type: integer
      trial_days:
        maximum: 90
        minimum: 0
        type: integer
    type: object
host: linkpay-service:3020
info:
  contact: {}
  description: Links de pagamento avulso, comissões e splits — Instituto Itinerante
    de Tecnologia
  title: LinkPay API
  version: "1.0"
paths:
  /api/v1/admin/linkpay/anticipation/preview:
    get:
      description: Retorna o preview de antecipação de recebíveis de cartão (taxa
        2%, D+2). 204 se não houver elegíveis.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AnticipationPreview'
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Preview de antecipação
      tags:
      - admin
  /api/v1/admin/linkpay/anticipation/request:
    post:
      consumes:
      - application/json
      description: Solicita antecipação de recebíveis de cartão com taxa de 2%, liberação
        em D+2.
      parameters:
      - description: Chave PIX (opcional se já cadastrada)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.AnticipationRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CreatorPayout'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Solicita antecipação
      tags:
      - admin
  /api/v1/admin/linkpay/balance:
    get:
      description: Retorna saldo disponível, retido, em reserva e próxima data de
        repasse do tenant autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Balance'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Saldo do produtor
      tags:
      - admin
  /api/v1/admin/linkpay/payouts:
    get:
      description: Lista repasses do tenant autenticado com paginação (page, limit).
      parameters:
      - description: Página (default 1)
        in: query
        name: page
        type: integer
      - description: Itens por página, max 100 (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ListPayoutsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista repasses
      tags:
      - admin
  /api/v1/admin/linkpay/payouts/request:
    post:
      consumes:
      - application/json
      description: Solicita transferência PIX do saldo disponível. amount_cents=0
        usa saldo total.
      parameters:
      - description: Chave PIX e valor
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.PayoutRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CreatorPayout'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Solicita saque manual
      tags:
      - admin
  /api/v1/admin/linkpay/stats:
    get:
      description: Retorna métricas de vendas dos últimos 30 dias para o tenant autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.StatsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Estatísticas de vendas
      tags:
      - admin
  /api/v1/linkpay/products:
    get:
      description: Retorna todos os produtos digitais do tenant autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/domain.DigitalProduct'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista produtos do tenant
      tags:
      - produtos
    post:
      consumes:
      - application/json
      description: Cria um novo produto digital para o tenant autenticado.
      parameters:
      - description: Dados do produto
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateDigitalProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DigitalProduct'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria produto digital
      tags:
      - produtos
  /api/v1/linkpay/products/{id}:
    delete:
      description: Desativa (soft delete) um produto do tenant autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Desativa produto digital
      tags:
      - produtos
    get:
      description: Retorna um produto digital pelo ID para o tenant autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DigitalProduct'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retorna produto por ID
      tags:
      - produtos
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um produto do tenant autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateDigitalProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DigitalProduct'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza produto digital
      tags:
      - produtos
  /api/v1/linkpay/products/{id}/files:
    get:
      description: Lista todos os arquivos adicionais associados ao produto do tenant
        autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/domain.DigitalProductFile'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista arquivos do produto
      tags:
      - produtos
    post:
      consumes:
      - multipart/form-data
      description: Faz upload de um arquivo adicional (multipart/form-data, campo
        "file") para o produto. Máximo 2 GB.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo a enviar
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DigitalProductFile'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Adiciona arquivo ao produto
      tags:
      - produtos
  /api/v1/linkpay/products/{id}/files/{fileId}:
    delete:
      description: Remove um arquivo adicional do produto (banco + MinIO).
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: ID do arquivo (UUID)
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove arquivo do produto
      tags:
      - produtos
  /api/v1/linkpay/products/{id}/plans:
    get:
      description: Lista os planos de assinatura ativos de um produto.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/domain.DigitalSubscriptionPlan'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista planos do produto
      tags:
      - planos
    post:
      consumes:
      - application/json
      description: Cria um plano de assinatura recorrente para um produto do tenant
        autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Dados do plano
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateSubscriptionPlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DigitalSubscriptionPlan'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria plano de assinatura
      tags:
      - planos
  /api/v1/linkpay/products/{id}/plans/{plan_id}:
    delete:
      description: Desativa (soft delete) um plano de assinatura do tenant autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: ID do plano (UUID)
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Desativa plano de assinatura
      tags:
      - planos
    put:
      consumes:
      - application/json
      description: Atualiza nome, preço, trial ou features de um plano do tenant autenticado.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: ID do plano (UUID)
        in: path
        name: plan_id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateSubscriptionPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DigitalSubscriptionPlan'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza plano de assinatura
      tags:
      - planos
  /api/v1/linkpay/products/{id}/upload:
    post:
      consumes:
      - multipart/form-data
      description: Faz upload de um arquivo digital para o MinIO (multipart/form-data,
        campo "file"). Máximo 2 GB.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo a enviar
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload de arquivo do produto
      tags:
      - produtos
  /api/v1/linkpay/webhook:
    post:
      consumes:
      - application/json
      description: Recebe eventos do Asaas (PAYMENT_CONFIRMED, PAYMENT_RECEIVED, TRANSFER_COMPLETED,
        etc.). Requer header asaas-access-token.
      parameters:
      - description: Token de segurança enviado pelo Asaas
        in: header
        name: asaas-access-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook Asaas
      tags:
      - webhook
  /api/v1/public/download/{token}/file/{fileId}:
    get:
      description: Valida o token de compra e redireciona (302) para presigned URL
        do MinIO. Expira em 15 min.
      parameters:
      - description: Token de acesso da compra
        in: path
        name: token
        required: true
        type: string
      - description: ID do arquivo (UUID)
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download de arquivo individual
      tags:
      - público
  /api/v1/public/download/{token}/zip:
    get:
      description: Gera e faz streaming de um ZIP com todos os arquivos do produto.
        Requer pagamento confirmado.
      parameters:
      - description: Token de acesso da compra
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download ZIP de todos os arquivos
      tags:
      - público
  /api/v1/public/products/{id}/subscribe:
    post:
      consumes:
      - application/json
      description: Cria uma assinatura recorrente no Asaas para um plano de produto.
      parameters:
      - description: ID do produto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Dados do assinante
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.SubscribeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DigitalSubscription'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inicia assinatura
      tags:
      - público
  /api/v1/public/products/{slug}:
    get:
      description: Retorna os dados públicos de um produto digital pelo slug, incluindo
        arquivos adicionais.
      parameters:
      - description: Slug do produto
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DigitalProduct'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Retorna produto público por slug
      tags:
      - público
  /api/v1/public/products/{slug}/cart:
    post:
      consumes:
      - application/json
      description: Cria um carrinho no cart-service com o produto principal e, opcionalmente,
        os upsells sugeridos (BKL-1221).
      parameters:
      - description: Slug do produto
        in: path
        name: slug
        required: true
        type: string
      - description: Opções do carrinho
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateCartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria carrinho com upsells
      tags:
      - público
  /api/v1/public/products/{slug}/purchase:
    post:
      consumes:
      - application/json
      description: Cria uma cobrança no Asaas (PIX ou cartão) para o produto informado.
      parameters:
      - description: Slug do produto
        in: path
        name: slug
        required: true
        type: string
      - description: Dados do comprador e método de pagamento
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.InitiatePurchaseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.DigitalPurchase'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inicia compra de produto
      tags:
      - público
  /api/v1/public/subscriptions/{token}:
    get:
      description: Retorna o status da assinatura e os arquivos disponíveis para o
        assinante.
      parameters:
      - description: Token da assinatura
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Status da assinatura
      tags:
      - público
  /api/v1/public/subscriptions/{token}/cancel:
    post:
      description: Cancela a assinatura pelo token público do assinante.
      parameters:
      - description: Token da assinatura
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cancela assinatura
      tags:
      - público
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token — formato: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
