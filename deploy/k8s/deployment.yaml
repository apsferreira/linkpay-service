apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkpay-service
  namespace: production
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: linkpay-service
    component: backend
    team: apsferreira
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkpay-service
  template:
    metadata:
      labels:
        app: linkpay-service
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3020"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/apsferreira/linkpay-service:IMAGE_TAG
          ports:
            - containerPort: 3020
              name: http
          envFrom:
            - configMapRef:
                name: linkpay-config
            - secretRef:
                name: linkpay-secrets
          env:
            # LGPD Art. 46: chave AES-256-GCM para cifrar dados pessoais (CPF).
            # Adicionar `encryption-key` no Vault (secret/linkpay-service). Sem a
            # chave o serviço segue funcionando e simplesmente NÃO persiste CPFs
            # (nunca em plaintext) — optional:true evita crash de deploy.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: linkpay-secrets
                  key: encryption-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 3020
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3020
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
