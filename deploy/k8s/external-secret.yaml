apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: linkpay-service
  namespace: production
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster-store
  target:
    name: linkpay-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/linkpay-service
